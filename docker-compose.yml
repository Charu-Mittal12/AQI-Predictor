services:

  # ── MLflow Model Server ───────────────────────────────────────────────────────
  mlflow-server:
    build: ./mlflow   
    container_name: aqi-mlflow
    volumes:
      - ./mlruns:/home/charu-mittal/AQI_Predictor/mlruns
    environment:
      - MLFLOW_TRACKING_URI=file:///home/charu-mittal/AQI_Predictor/mlruns
    ports:
      - "5001:5001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5001/ping || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s  
    restart: unless-stopped
    networks:
      - aqi-net



  # ── Application ───────────────────────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: aqi-backend
    env_file:
      - .env
    environment:
      - MLFLOW_TRACKING_URI=file:///home/charu-mittal/AQI_Predictor/mlruns
      - MLFLOW_SERVE_URI=http://mlflow-server:5001
      - DB_PATH=/backend/database/live_aqi_buffer.db
    volumes:
      - ./mlruns:/home/charu-mittal/AQI_Predictor/mlruns
      - ./database:/backend/database
      - ./backend/drift_baseline:/backend/drift_baseline
    ports:
      - "8000:8000"
    depends_on:
      mlflow-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - aqi-net

  frontend:
    build: ./frontend
    container_name: aqi-frontend
    environment:
      - BACKEND_URL=http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - aqi-net

  # ── Monitoring Stack ──────────────────────────────────────────────────────────
  node-exporter:
    image: prom/node-exporter:latest
    container_name: aqi-node-exporter
    ports:
      - "9100:9100"
    pid: host
    restart: unless-stopped
    volumes:
      - "/:/host:ro,rslave"
    command:
      - "--path.rootfs=/host"
    networks:
      - aqi-net

  alertmanager:
    image: prom/alertmanager:latest
    container_name: aqi-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    restart: unless-stopped
    networks:
      - aqi-net

  prometheus:
    image: prom/prometheus:latest
    container_name: aqi-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    depends_on:
      backend:
        condition: service_healthy
      alertmanager:
        condition: service_started
      node-exporter:
        condition: service_started
    restart: unless-stopped
    networks:
      - aqi-net

  grafana:
    image: grafana/grafana:latest
    container_name: aqi-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/aqi-monitoring-dashboard.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - aqi-net

networks:
  aqi-net:
    driver: bridge